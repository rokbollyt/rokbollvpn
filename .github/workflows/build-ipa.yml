name: Build TrollStore IPA

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Install tools
        run: |
          brew install xcodegen ldid

      - name: Make scripts executable
        run: |
          chmod +x happ-ios-port/build_ios.sh
          chmod +x happ-ios-port/build_ios_app.sh

      - name: Build IPA
        run: |
          cd happ-ios-port
          ./build_ios_app.sh

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: HappPort-TrollStore-IPA
          path: happ-ios-port/HappPort-TrollStore.ipa
          retention-days: 14

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: latest
          name: "Happ Multi-Protocol (Android APK + iOS TrollStore IPA) AWG/WG/MAX-TURN"
          draft: false
          prerelease: false
          files: |
            happ-ios-port/HappPort-TrollStore.ipa
            android-release/Happ-MAX-Release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

